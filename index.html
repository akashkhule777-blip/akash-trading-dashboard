<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKASH KHULE - LIVE TRADING</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f1115] text-white p-3">
<div class="max-w-6xl mx-auto">
<h1 class="text-2xl font-bold text-center mb-4">AKASH KHULE - LIVE TRADING</h1>

<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
<div class="bg-[#1c1f26] p-4 rounded-xl">
<h2 class="font-bold mb-2">Angel One Login</h2>
<input id="api_key" placeholder="API Key" class="w-full p-2 mb-2 bg-black rounded text-white">
<input id="client_id" placeholder="Client ID" class="w-full p-2 mb-2 bg-black rounded text-white">
<input id="password" placeholder="Password (MPIN)" class="w-full p-2 mb-2 bg-black rounded text-white">
<input id="totp_secret" placeholder="TOTP Secret" class="w-full p-2 mb-2 bg-black rounded text-white">
<button id="connectBtn" onclick="connect()" class="w-full bg-blue-600 py-3 rounded font-bold">CONNECT</button>
<div id="status" class="mt-2 text-xs p-2 bg-yellow-600 text-black rounded">Backend waking up... 60 sec thamba</div>
</div>

<div class="bg-[#1c1f26] p-4 rounded-xl">
<h2 class="font-bold mb-2">Portfolio</h2>
<div>Holdings: <span id="holdings">--</span></div>
<div>Positions: <span id="positions">--</span></div>
<div class="text-green-400">PnL Today: <span id="pnl">₹ 0.00</span></div>
<button onclick="loadData()" class="w-full bg-green-600 mt-4 py-2 rounded">Refresh Data</button>
</div>

<div class="bg-[#1c1f26] p-4 rounded-xl">
<h2 class="font-bold mb-2">Nifty 50 Live</h2>
<div id="niftyPrice" class="text-xl text-green-400">Loading...</div>
<div class="text-xs mt-2">Backend: akash-trading-backend.onrender.com</div>
<div class="text-xs">Auto wake enabled</div>
</div>
</div>

<div class="bg-[#1c1f26] p-2 rounded-xl h-[400px]">
<div id="tradingview_widget" class="h-full"></div>
</div>

<pre id="log" class="bg-black text-lime-400 p-2 mt-3 text-xs overflow-auto"></pre>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
const BACKEND = "https://akash-trading-backend.onrender.com";
let AUTH_TOKEN = "";

async function wakeBackend() {
  const s = document.getElementById('status');
  s.innerText = "Backend waking... 30 sec...";
  try {
    await fetch(BACKEND + "/", {mode: 'no-cors'});
    const r = await fetch(BACKEND + "/ip").then(x=>x.text()).catch(()=> "LIVE");
    s.innerText = "Backend LIVE! " + r + " | Aata CONNECT daba";
    s.className = "mt-2 text-xs p-2 bg-green-500 text-white rounded";
    document.getElementById('niftyPrice').innerText = "Backend Connected ✅";
  } catch(e) {
    s.innerText = "Backend waking... 2nd try... 60 sec thamba";
    setTimeout(wakeBackend, 5000);
  }
}
wakeBackend();

async function connect() {
  const btn = document.getElementById('connectBtn');
  const s = document.getElementById('status');
  const log = document.getElementById('log');
  btn.innerText = "CONNECTING...";
  s.innerText = "Logging in to Angel One...";

  try {
    const res = await fetch(BACKEND + "/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        api_key: document.getElementById('api_key').value.trim(),
        client_id: document.getElementById('client_id').value.trim(),
        password: document.getElementById('password').value.trim(),
        totp_secret: document.getElementById('totp_secret').value.trim()
      })
    });
    const data = await res.json();
    log.textContent = JSON.stringify(data, null, 2);

    if(data.status === true || data.data) {
      AUTH_TOKEN = data.data?.jwtToken || data.data?.jwt_token || "";
      localStorage.setItem("ak_token", AUTH_TOKEN);
      localStorage.setItem("ak_api_key", document.getElementById('api_key').value.trim());
      s.innerText = "Connected! ✅ Data loading...";
      s.className = "mt-2 text-xs p-2 bg-green-600 text-white rounded";
      btn.innerText = "CONNECTED ✅";
      loadData();
    } else {
      s.innerText = "Error: " + (data.message || data.error || "Login failed");
      s.className = "mt-2 text-xs p-2 bg-red-600 text-white rounded";
      btn.innerText = "CONNECT";
    }
  } catch(err) {
    s.innerText = "Backend zopayla aahe, 60 sec ne parat CONNECT daba";
    log.textContent = err.toString();
    btn.innerText = "CONNECT";
  }
}

async function loadData() {
  try {
    const api_key = document.getElementById('api_key').value || localStorage.getItem("ak_api_key");
    const token = localStorage.getItem("ak_token");
    if(!token) return;

    const h = await fetch(BACKEND + "/holdings", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({api_key, jwtToken: token})
    }).then(r=>r.json());

    document.getElementById('holdings').innerText = (h.data?.holdings?.length || 0) + " stocks";
    document.getElementById('pnl').innerText = "₹ " + (h.data?.totalandrealizedprofit || "0.00");
    document.getElementById('log').textContent = "Holdings: " + JSON.stringify(h).substring(0,500);
  } catch(e) {}
}

new TradingView.widget({
  "autosize": true,
  "symbol": "NSE:NIFTY",
  "interval": "D",
  "timezone": "Asia/Kolkata",
  "theme": "dark",
  "style": "1",
  "container_id": "tradingview_widget"
});
</script>
</body>
</html>
