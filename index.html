<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akash Trading - Live</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:10px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:12px}
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none}
button{width:100%;padding:12px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}
.btn-blue{background:#2563eb;color:white}
.btn-green{background:#16a34a;color:white;margin-top:8px}
.holding{border-bottom:1px solid #334155;padding:8px 0;display:flex;justify-content:space-between}
.pnl-plus{color:#22c55e;font-weight:bold}
.pnl-minus{color:#ef4444;font-weight:bold}
</style>
</head>
<body>
<h2>📈 Akash Live Trading</h2>

<div class="card" id="loginCard">
<h3>Angel One Connect</h3>
<input id="api_key" placeholder="API Key">
<input id="client_id" placeholder="Client ID (ex: A123456)">
<input id="password" placeholder="MPIN / Password">
<input id="totp_secret" placeholder="TOTP Secret">
<button class="btn-blue" onclick="connect()">CONNECT</button>
<p id="status" style="margin-top:10px;color:#93c5fd"></p>
</div>

<div class="card">
<h3>Backend: <span id="backendStatus">Checking...</span></h3>
<div id="chart" style="height:350px"></div>
</div>

<div class="card">
<h3>Portfolio - PnL Today: <span id="pnlToday">₹0.00</span></h3>
<button class="btn-green" onclick="refreshData()">🔄 Refresh Data</button>
<h4 style="margin-top:15px">Holdings:</h4>
<div id="holdingsList">-- Connect kara --</div>
<h4 style="margin-top:15px">Positions:</h4>
<div id="positionsList">--</div>
</div>

<script>
const BACKEND_URL = "https://akash-trading-backend.onrender.com";
let authData = null;

async function checkBackend(){
 try{
  let r = await fetch(BACKEND_URL);
  let t = await r.text();
  document.getElementById('backendStatus').innerHTML = "Connected ✅ - " + t.substring(0,30);
  document.getElementById('backendStatus').style.color = "#22c55e";
 }catch(e){
  document.getElementById('backendStatus').innerHTML = "Backend waking up... 50 sec thamba";
  document.getElementById('backendStatus').style.color = "#facc15";
 }
 loadChart();
}
checkBackend();

function loadChart(){
 new TradingView.widget({
  "autosize": true,
  "symbol": "NSE:NIFTY",
  "interval": "15",
  "timezone": "Asia/Kolkata",
  "theme": "dark",
  "style": "1",
  "locale": "in",
  "container_id": "chart"
 });
}

async function connect(){
 const api_key = document.getElementById('api_key').value.trim();
 const client_id = document.getElementById('client_id').value.trim();
 const password = document.getElementById('password').value.trim();
 const totp_secret = document.getElementById('totp_secret').value.trim();
 if(!api_key||!client_id||!password||!totp_secret){alert("Sagla bhara!");return;}
 document.getElementById('status').innerText = "Connecting... 10 sec thamba...";
 try{
  let res = await fetch(BACKEND_URL+'/login', {
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify({api_key, client_id, password, totp_secret})
  });
  let data = await res.json();
  console.log(data);
  if(data.status === false){ document.getElementById('status').innerText = "Error: " + (data.message || data.error); return; }
  let jwt = data.data.jwtToken || data.data.jwt_token || data.data.accessToken;
  let refresh = data.data.refreshToken;
  authData = {api_key, jwtToken: jwt, refreshToken: refresh};
  localStorage.setItem('akash_auth', JSON.stringify(authData));
  localStorage.setItem('akash_creds', JSON.stringify({api_key, client_id, password, totp_secret}));
  document.getElementById('status').innerText = "CONNECTED ✅ Holdings load hotay...";
  document.getElementById('status').style.color = "#22c55e";
  refreshData();
 }catch(e){
  document.getElementById('status').innerText = "Error: " + e.message + " - Backend wake up hotay, 1 min nantar parat daba";
 }
}

async function refreshData(){
 if(!authData){
  let saved = localStorage.getItem('akash_auth');
  if(saved) authData = JSON.parse(saved);
  else {alert("Pahile CONNECT daba!");return;}
 }
 document.getElementById('holdingsList').innerHTML = "Loading...";
 try{
  let res = await fetch(BACKEND_URL+'/holdings', {
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify(authData)
  });
  let data = await res.json();
  console.log("Holdings data", data);
  let holdings = data.holdings?.data || data.holdings?.data?.holdings || [];
  let positions = data.positions?.data || [];
  
  // Holdings show
  let hHtml = "";
  let totalPnl = 0;
  if(holdings.length==0) hHtml = "Kahi holdings nahi / Market band aahe";
  holdings.forEach(h=>{
   let pnl = parseFloat(h.realisedquantity ? h.pnl || 0 : h.pnl || 0) || parseFloat(h.profitandloss || 0) || 0;
   totalPnl += pnl;
   let ltp = h.ltp || h.lastprice || 0;
   hHtml += `<div class="holding"><span><b>${h.tradingsymbol}</b> (${h.quantity}) @ ${ltp}</span><span class="${pnl>=0?'pnl-plus':'pnl-minus'}">₹${pnl.toFixed(2)}</span></div>`;
  });
  document.getElementById('holdingsList').innerHTML = hHtml;
  
  // Positions show
  let pHtml = "";
  let todayPnl = 0;
  if(positions.length==0) pHtml = "Aaj kahi position nahi";
  positions.forEach(p=>{
   let pnl = parseFloat(p.pnl || 0);
   todayPnl += pnl;
   pHtml += `<div class="holding"><span><b>${p.tradingsymbol}</b> Qty:${p.netqty}</span><span class="${pnl>=0?'pnl-plus':'pnl-minus'}">₹${pnl.toFixed(2)}</span></div>`;
  });
  document.getElementById('positionsList').innerHTML = pHtml;
  document.getElementById('pnlToday').innerText = `₹${(totalPnl+todayPnl).toFixed(2)}`;
  document.getElementById('pnlToday').className = (totalPnl+todayPnl)>=0 ? 'pnl-plus' : 'pnl-minus';
  
 }catch(e){
  document.getElementById('holdingsList').innerHTML = "Error: " + e.message;
 }
}

// Auto fill saved creds
window.onload = ()=>{
 let c = localStorage.getItem('akash_creds');
 if(c){
  c = JSON.parse(c);
  document.getElementById('api_key').value = c.api_key||"";
  document.getElementById('client_id').value = c.client_id||"";
  document.getElementById('password').value = c.password||"";
  document.getElementById('totp_secret').value = c.totp_secret||"";
 }
}
</script>
</body>
</html>
